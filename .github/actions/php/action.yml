name: Install PHP dependencies
description: Install Composer dependencies from the lockfile
inputs:
  coverage:
    description: Coverage extension to enable
    default: none
  memory-limit:
    description: PHP CLI memory limit for the selected job
    default: ''
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.4'
        tools: composer:2.11.2
        extensions: curl, dom, mbstring, pdo_mysql, xml, zip
        coverage: ${{ inputs.coverage }}
        ini-values: ${{ inputs.memory-limit && format('memory_limit={0}', inputs.memory-limit) || '' }}
    - shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
