name: Install Node dependencies
description: Install the pinned Node version and npm lockfile
runs:
  using: composite
  steps:
    - id: runtime
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - id: downloads
      shell: bash
      run: printf 'path=%s\n' "$(npm config get cache)/_cacache" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.downloads.outputs.path }}
        key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.node-version', '.npmrc', '.github/actions/node/action.yml') }}
    - shell: bash
      run: npm ci
