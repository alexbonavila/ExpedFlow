name: Install Node dependencies
description: Install the pinned Node version and npm lockfile
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        cache: npm
    - shell: bash
      run: npm ci
